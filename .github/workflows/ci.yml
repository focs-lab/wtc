name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and green from day one: the shim is plain C++ and needs no
  # toolchain of ours. Pinned to a release rather than ubuntu-latest,
  # because a required check must not move under us.
  shim:
    name: Shim headers compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y g++ clang
      - name: Compile every shim header on its own
        run: |
          set -e
          for h in shim/*.hpp; do
            echo "== $h"
            printf '#include "%s"\nint main(){}\n' "$(basename "$h")" > /tmp/tu.cpp
            clang++ -std=c++17 -Ishim -fsyntax-only -Wall -Werror /tmp/tu.cpp
            g++     -std=c++17 -Ishim -fsyntax-only -Wall \
                    -Wno-attributes /tmp/tu.cpp
          done
      - name: Compile them together
        run: |
          cat > /tmp/all.cpp <<'CPP'
          #include "queue.hpp"
          #include "mutex.hpp"
          #include "thread.hpp"
          static void worker(void *) {}
          int main() {
            wtc::queue<int> q;
            q.push(42);
            auto got = q.try_pop();
            wtc::mutex m;
            m.lock();
            m.unlock();
            auto t = wtc::spawn(worker, nullptr);
            t.join();
            return got ? *got : 0;
          }
          CPP
          clang++ -std=c++17 -Ishim -fsyntax-only -Wall -Werror /tmp/all.cpp

  # Which toolchain image this commit needs, derived from the submodule pin
  # rather than configured separately. The two cannot drift apart.
  toolchain:
    name: Resolve toolchain image
    runs-on: ubuntu-24.04
    if: vars.WTC_TOOLCHAIN_IMAGE != ''
    outputs:
      image: ${{ steps.pick.outputs.image }}
      rev:   ${{ steps.pick.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          set -euo pipefail
          rev=$(git rev-parse HEAD:llvm)
          echo "rev=$rev"                                                 >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.WTC_TOOLCHAIN_IMAGE }}:llvm-${rev:0:12}"   >> "$GITHUB_OUTPUT"
      - name: A toolchain image must exist for this pin
        run: |
          docker manifest inspect "${{ steps.pick.outputs.image }}" >/dev/null || {
            echo "::error::No toolchain image for llvm pin ${{ steps.pick.outputs.rev }}."
            echo "::error::Build and push one before moving the pin. See docs/toolchain.md."
            exit 1; }

  build:
    name: Build and test
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.toolchain.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: The image matches the pin
        run: test "$WTC_LLVM_REV" = "${{ needs.toolchain.outputs.rev }}"
      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DClang_DIR=/opt/llvm/lib/cmake/clang \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_BUILD_RPATH=/opt/llvm/lib
      - name: Build
        run: cmake --build build
      - name: wtc-opt exists
        run: test -x build/bin/wtc-opt
      - name: Test
        run: cmake --build build --target check-wtc 2>&1 | tee lit.log
      - name: The suite must not be empty
        run: |
          grep -qE 'Total Discovered Tests: [1-9][0-9]*' lit.log
