name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and green from day one: the shim is plain C++ and needs no
  # toolchain of ours. Pinned to a release rather than ubuntu-latest,
  # because a required check must not move under us.
  shim:
    name: Shim headers compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y g++ clang
      - name: Compile every shim header on its own
        run: |
          set -e
          for h in shim/*.hpp; do
            echo "== $h"
            printf '#include "%s"\nint main(){}\n' "$(basename "$h")" > /tmp/tu.cpp
            clang++ -std=c++17 -Ishim -fsyntax-only -Wall -Werror /tmp/tu.cpp
            g++     -std=c++17 -Ishim -fsyntax-only -Wall \
                    -Wno-attributes /tmp/tu.cpp
          done
      - name: Compile them together
        run: |
          cat > /tmp/all.cpp <<'CPP'
          #include "queue.hpp"
          #include "mutex.hpp"
          #include "thread.hpp"
          static void worker(void *) {}
          int main() {
            wtc::queue<int> q;
            q.push(42);
            auto got = q.try_pop();
            wtc::mutex m;
            m.lock();
            m.unlock();
            auto t = wtc::spawn(worker, nullptr);
            t.join();
            return got ? *got : 0;
          }
          CPP
          clang++ -std=c++17 -Ishim -fsyntax-only -Wall -Werror /tmp/all.cpp

  # Which toolchain image this commit needs, derived from the submodule pin
  # rather than configured separately. The two cannot drift apart.
  toolchain:
    name: Resolve toolchain image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.pick.outputs.image }}
      rev:   ${{ steps.pick.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
      # A missing variable used to skip this job, which skipped `build` and
      # left the run green. A green run that built nothing is the one outcome
      # this workflow exists to prevent, so it fails instead.
      - name: The toolchain image must be configured
        env:
          IMAGE_BASE: ${{ vars.WTC_TOOLCHAIN_IMAGE }}
        run: |
          test -n "$IMAGE_BASE" || {
            echo "::error::Repository variable WTC_TOOLCHAIN_IMAGE is not set."
            echo "::error::Publish a toolchain image and set it. See docs/toolchain.md."
            exit 1; }
      - id: pick
        env:
          IMAGE_BASE: ${{ vars.WTC_TOOLCHAIN_IMAGE }}
        run: |
          set -euo pipefail
          rev=$(git rev-parse HEAD:llvm)
          echo "rev=$rev"                                >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_BASE}:llvm-${rev:0:12}"     >> "$GITHUB_OUTPUT"
      # `docker manifest inspect` answers "denied" both for an image that was
      # never pushed and for one whose package is private. Naming only the
      # first sends someone off to rebuild a toolchain that already exists.
      - name: A toolchain image must exist and be readable
        env:
          IMAGE: ${{ steps.pick.outputs.image }}
          REV: ${{ steps.pick.outputs.rev }}
        run: |
          docker manifest inspect "$IMAGE" >/dev/null || {
            echo "::error::Cannot read $IMAGE for llvm pin $REV."
            echo "::error::Either no image was pushed for this pin, or the package"
            echo "::error::is private. Check both. See docs/toolchain.md."
            exit 1; }

  build:
    name: Build and test
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.toolchain.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: The image matches the pin
        env:
          REV: ${{ needs.toolchain.outputs.rev }}
        run: test "$WTC_LLVM_REV" = "$REV"
      # An empty LLVM_EXTERNAL_LIT is indistinguishable from an unset one:
      # CMake falls back to a path that install trees never ship, warns once,
      # and the failure surfaces much later and further away. Fail here.
      - name: lit must be on PATH
        run: command -v lit
      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DClang_DIR=/opt/llvm/lib/cmake/clang \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)"
      - name: Build
        run: cmake --build build
      - name: wtc-opt exists
        run: test -x build/bin/wtc-opt
      # Without pipefail the step takes tee's exit status, which is always
      # zero, and a failing suite reports green. GitHub's default shell is
      # `bash -e`, not `bash -eo pipefail`.
      - name: Test
        run: |
          set -o pipefail
          cmake --build build --target check-wtc 2>&1 | tee lit.log
      # lit prints the discovery line on failing runs too, so counting tests
      # proves only that something ran. Assert the outcome as well.
      - name: The suite ran and passed
        run: |
          grep -qE 'Total Discovered Tests: [1-9][0-9]*' lit.log
          ! grep -qE '^ *(Failed|Unexpectedly Passed|Timed Out) *:' lit.log
