<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="W3 pipeline throughput"><title>W3 pipeline throughput</title><rect x="0.5" y="0.5" width="899" height="489" rx="12" fill="#FBFAF7" stroke="#E4DFD5"/><text x="28" y="38" font-size="18" fill="#172033" text-anchor="start" font-weight="600">A three-stage pipeline</text><text x="28" y="62" font-size="14" fill="#5F6773" text-anchor="start">M records/s, closed loop; W3, 64-byte records, 3 cores; paired, frequency not fixed, 5 reps, glibc, 2026-10-27</text><text x="28" y="118" font-size="12" fill="#5F6773" text-anchor="start" font-weight="600">ONE SOURCE, FOUR BUILDS</text><text x="318" y="153" font-size="14" fill="#172033" text-anchor="end">as written (B0)</text><rect x="330" y="140" width="221" height="18" fill="#9AA5B4" rx="3"/><text x="559" y="154" font-size="14" fill="#172033" text-anchor="start">8.90</text><text x="318" y="187" font-size="14" fill="#172033" text-anchor="end">tags by hand, by pointer (B3)</text><rect x="330" y="174" width="343" height="18" fill="#2F6FB2" rx="3"/><text x="681" y="188" font-size="14" fill="#172033" text-anchor="start">13.82</text><text x="318" y="221" font-size="14" fill="#172033" text-anchor="end">tags by hand, inline (B3)</text><rect x="330" y="208" width="420" height="18" fill="#E8A27E" rx="3"/><text x="758" y="222" font-size="14" fill="#172033" text-anchor="start">16.91</text><text x="318" y="255" font-size="14" fill="#C2562A" text-anchor="end" font-weight="600">the compiler</text><rect x="330" y="242" width="420" height="18" fill="#C2562A" rx="3"/><text x="758" y="256" font-size="14" fill="#172033" text-anchor="start" font-weight="600">16.91</text><text x="28" y="288" font-size="12" fill="#5F6773" text-anchor="start" font-weight="600">A LIBRARY'S QUEUE BETWEEN THE STAGES</text><text x="318" y="323" font-size="14" fill="#172033" text-anchor="end">oneTBB concurrent_queue (B1)</text><text x="338" y="324" font-size="14" fill="#5F6773" text-anchor="start">not run on this host</text><text x="318" y="357" font-size="14" fill="#172033" text-anchor="end">moodycamel CQ (B1)</text><rect x="330" y="344" width="135" height="18" fill="#5B6676" rx="3"/><text x="473" y="358" font-size="14" fill="#172033" text-anchor="start">5.46</text><text x="318" y="391" font-size="14" fill="#172033" text-anchor="end">rigtorp, inline (B2)</text><rect x="330" y="378" width="349" height="18" fill="#E8A27E" rx="3"/><text x="687" y="392" font-size="14" fill="#172033" text-anchor="start">14.05</text><text x="318" y="425" font-size="14" fill="#172033" text-anchor="end">moodycamel RWQ, inline (B2)</text><rect x="330" y="412" width="281" height="18" fill="#E8A27E" rx="3"/><text x="619" y="426" font-size="14" fill="#172033" text-anchor="start">11.34</text><text x="318" y="459" font-size="14" fill="#172033" text-anchor="end">the shim's inline ring</text><rect x="330" y="446" width="308" height="18" fill="#C2562A" rx="3"/><text x="646" y="460" font-size="14" fill="#172033" text-anchor="start">12.42</text></svg>
